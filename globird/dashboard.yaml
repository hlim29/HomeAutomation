        type: statistics-graph
        entities:
          - sensor.sigen_inverter_pv_power
          - sensor.sigen_plant_battery_power
          - sensor.sigen_plant_grid_import_power
          - sensor.sigen_plant_grid_export_power
          - sensor.sigen_plant_consumed_power
