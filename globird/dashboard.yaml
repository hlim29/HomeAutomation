views:
  - type: masonry
    path: home
    title: Home
    cards:
      - type: vertical-stack
        cards:
          - type: entities
            entities:
              - entity: switch.enable_import
              - entity: number.sigen_plant_ess_max_charging_limit
                name:
                  type: entity
          - type: entities
            entities:
              - entity: switch.enable_export
                type: custom:multiple-entity-row
                toggle: true
                entities:
                  - entity: number.sigen_plant_grid_export_limitation
                    name: Limit (kW)
                    format: input_number
          - type: entities
            entities:
              - entity: number.sigen_plant_pv_max_power_limit
          - type: horizontal-stack
            cards:
              - type: horizontal-stack
                cards:
                  - type: custom:button-card
                    entity: switch.shellyem3
                    section_mode: true
                    size: 15%
                    label: |
                      [[[
                        var bri = states['switch.shellyem3'].state;
                        var wattage = states['sensor.shellyem3_phase_a_power'].state;
                        return wattage + ' W';
                      ]]]
                    show_label: true
                  - type: tile
                    entity: timer.ems_timer
                    vertical: false
                    features_position: bottom
          - type: logbook
            target:
              entity_id:
                - select.sigen_plant_remote_ems_control_mode
      - type: vertical-stack
        cards:
          - type: custom:apexcharts-card
            update_interval: 30sec
            experimental:
              hidden_by_default: true
            apex_config:
              legend:
                show: true
                position: top
                onItemClick:
                  toggleDataSeries: true
                onItemHover:
                  highlightDataSeries: true
              chart:
                height: auto
            header:
              show: true
              show_states: true
              colorize_states: true
            graph_span: 24h
            span:
              start: minute
              offset: '-24h'
            all_series_config:
              stroke_width: 2
            yaxis:
              - id: power
                min: -4
                max: 12
                decimals: 0
                apex_config:
                  title:
                    text: Power (kW)
                  forceNiceScale: true
                  tick_amount: 4
              - id: soc
                min: -100
                max: 100
                decimals: 0
                apex_config:
                  title:
                    text: Battery State of Charge
                  opposite: true
                  forceNiceScale: true
                  tick_amount: 4
            series:
              - entity: sensor.sigen_plant_grid_active_power
                curve: straight
                type: area
                color: '#f0f'
                group_by:
                  func: avg
                  duration: 1m
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                unit: kW
                yaxis_id: power
              - entity: sensor.sigen_plant_pv_power
                curve: straight
                type: area
                color: '#fc0'
                group_by:
                  func: avg
                  duration: 1m
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                unit: kW
                yaxis_id: power
              - entity: sensor.sigen_plant_battery_power
                curve: straight
                type: area
                color: '#00f'
                group_by:
                  func: avg
                  duration: 1m
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                unit: kW
                yaxis_id: power
              - entity: sensor.sigen_plant_battery_state_of_charge
                curve: straight
                type: line
                color: '#f00'
                group_by:
                  func: avg
                  duration: 1m
                extend_to: false
                show:
                  in_header: false
                  legend_value: false
                unit: '%'
                yaxis_id: soc
          - type: entities
            entities:
              - entity: sensor.solcast_pv_forecast_forecast_tomorrow
              - entity: sensor.solcast_pv_forecast_forecast_day_3
          - type: entities
            entities:
              - entity: sensor.ac_power
              - entity: sensor.power_points_1_power
              - entity: sensor.power_points_2_power
              - entity: sensor.power_points_3_power
              - entity: sensor.shelly3em63g3_e4b063d8f384_power
              - entity: sensor.shelly3em63g3_e4b063dab42c_power
              - entity: sensor.shelly3em63g3_28372f3655b8_power
              - entity: sensor.shelly3em63g3_28372f367788_phase_a_power
              - entity: sensor.shelly3em63g3_28372f367788_phase_b_power
              - entity: sensor.shelly3em63g3_28372f367788_phase_c_power
              - entity: sensor.shelly3em63g3_28372f3655b8_power
              - entity: sensor.shellyem3_phase_a_power
      - type: vertical-stack
        cards:
          - type: energy-distribution
          - type: energy-sankey
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: select.sigen_plant_remote_ems_control_mode
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.sigen_inverter_battery_state_of_charge
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.sigen_plant_third_party_pv_power
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.sigen_plant_consumed_power
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.sigen_inverter_battery_power
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.sigen_plant_grid_active_power
        name:
          type: entity
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.solcast_pv_forecast_forecast_remaining_today
        name:
          type: entity
      - type: entity
        show_name: false
        show_state: true
        show_icon: true
        entity: sensor.sigen_plant_available_max_discharging_capacity
  - type: panel
    path: energy-plan
    title: Energy Plan
    cards:
      - type: custom:apexcharts-card
        experimental:
          hidden_by_default: true
        apex_config:
          chart:
            height: auto
        header:
          show: true
          show_states: true
          colorize_states: true
        graph_span: 24h
        span:
          start: minute
          offset: +0h
        all_series_config:
          stroke_width: 2
        yaxis:
          - id: power
            min: -25
            max: 25
            decimals: 0
            apex_config:
              title:
                text: Power (kW)
              forceNiceScale: true
              tick_amount: 4
          - id: soc
            min: -100
            max: 100
            decimals: 0
            show: false
            apex_config:
              title:
                text: Battery State of Charge
              opposite: true
              forceNiceScale: true
              tick_amount: 4
          - id: price
            min: -1
            max: 1
            decimals: 2
            apex_config:
              title:
                text: Price ($)
              opposite: true
              forceNiceScale: true
              tick_amount: 4
        series:
          - entity: sensor.mpc_cost_fun
            unit: $
            invert: true
            float_precision: 0
            name: Cost
            show:
              legend_value: false
              in_chart: false
            transform: return x *-1
            yaxis_id: power
          - entity: sensor.mpc_pv_power
            curve: straight
            type: area
            color: '#fc0'
            extend_to: false
            show:
              in_header: false
              legend_value: false
            unit: kW
            data_generator: |-
              return entity.attributes.forecasts.map((entry) => {
                return [new Date(entry.date), entry.mpc_pv_power/1000];
              });
            yaxis_id: power
          - entity: sensor.mpc_load_power
            curve: stepline
            type: area
            color: '#a0f'
            extend_to: false
            show:
              in_header: false
              legend_value: false
            unit: kW
            data_generator: |-
              return entity.attributes.forecasts.map((entry) => {
                return [new Date(entry.date), -entry.mpc_load_power/1000];
              });
            yaxis_id: power
          - entity: sensor.mpc_grid_power
            curve: stepline
            color: '#1af'
            type: area
            extend_to: false
            show:
              in_header: false
              legend_value: false
            unit: kW
            data_generator: |-
              return entity.attributes.forecasts.map((entry) => {
                return [new Date(entry.date), -entry.mpc_grid_power/1000];
              });
            yaxis_id: power
          - entity: sensor.mpc_batt_power
            curve: stepline
            color: '#00bb84'
            extend_to: false
            show:
              in_header: false
              legend_value: false
            stroke_width: 1
            type: area
            unit: kW
            data_generator: |-
              return entity.attributes.battery_scheduled_power.map((entry) => {
                return [new Date(entry.date), -entry.mpc_batt_power/1000];
              });
            yaxis_id: power
          - entity: sensor.mpc_batt_soc
            type: line
            curve: straight
            stroke_width: 4
            stroke_dash: 4
            color: '#00cc00'
            extend_to: false
            show:
              in_header: false
              legend_value: false
            data_generator: |-
              return entity.attributes.battery_scheduled_soc.map((entry) => {
                return [new Date(entry.date), entry.mpc_batt_soc];
              });
            yaxis_id: soc
          - entity: sensor.mpc_general_price
            stroke_width: 3
            curve: straight
            show:
              in_header: true
            color: '#4400ff'
            name: Buy Price
            data_generator: |-
              return entity.attributes.unit_load_cost_forecasts.map((entry) => {
                return [new Date(entry.date), entry.mpc_general_price];
              });
            yaxis_id: price
          - entity: sensor.mpc_feed_in_price
            stroke_width: 3
            curve: straight
            show:
              in_header: true
            color: '#ff00ff'
            name: Sell Price
            data_generator: >-
              return entity.attributes.unit_prod_price_forecasts.map((entry) =>
              {
                return [new Date(entry.date), entry.mpc_feed_in_price];
              });
            yaxis_id: price
          - entity: sensor.p_deferrable0
            curve: stepline
            type: area
            color: '#ffcc00'
            extend_to: false
            show:
              in_header: false
              legend_value: false
            unit: kW
            data_generator: |-
              return entity.attributes.deferrables_schedule.map((entry) => {
                return [new Date(entry.date), entry.p_deferrable0/1000];
              });
            yaxis_id: power
        view_layout:
          position: main
